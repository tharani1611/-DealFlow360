version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dealflow360-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dealflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dealflow_password}
      POSTGRES_DB: ${POSTGRES_DB:-dealflow360}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dealflow_user} -d ${POSTGRES_DB:-dealflow360}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dealflow360-backend
    environment:
      APP_NAME: DealFlow360
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dealflow_user}:${POSTGRES_PASSWORD:-dealflow_password}@db:5432/${POSTGRES_DB:-dealflow360}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost", "http://localhost:80", "http://localhost:5173"]}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["backend", "localhost", "127.0.0.1"]}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dealflow360-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres_data:
